[project]
name = "whisper-asr-pipeline"
version = "0.1.0"
description = "DIMER inference pipeline for OpenAI Whisper large-v3-turbo automatic speech recognition"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Kurt Valcorza" }]
dependencies = [
  "torch==2.6.0",
  "torchvision==0.21.0",
  "torchaudio==2.6.0",
  "transformers==4.52.1",
  "accelerate==1.3.0",
  "numpy==1.26.4",
  "soundfile==0.13.1",
]
[project.optional-dependencies]
tutorial = ["datasets==4.4.0", "pandas==2.2.3"]
dev = ["pytest==9.0.2", "ruff==0.12.10"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/whisper_asr_pipeline"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
